name: Update VAT Rates
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate VAT data
        run: python -m json.tool data/vat-rates.json > /tmp/vat.json
